<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COEP Room Scheduler</title>
    <style>
        :root {
            --primary: #d4a373;
            --dark: #1a1a1a;
            --panel: #252525;
            --white: #fefae0;
            --border: #444;
            --today-bg: #3a4750;
            --selected-blue: #1a73e8;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark);
            color: var(--white);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        nav {
            height: 60px;
            background-color: var(--panel);
            border-bottom: 2px solid var(--primary);
            display: flex;
            align-items: center;
            /* justify-content: space-between; */
            padding: 0 2rem;
            flex-shrink: 0;
        }

        .main-container {
            display: flex;
            flex: 1;
        }

        /* --- LEFT SIDEBAR: THE CALENDAR --- */
        .sidebar-left {
            width: 320px;
            background-color: var(--panel);
            padding: 1rem;
            border-right: 1px solid var(--border);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.85rem;
        }

        .calendar-day-label { color: #888; font-weight: bold; margin-bottom: 10px; }

        .calendar-date {
            padding: 8px 0;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.2s;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-date:hover { background: var(--border); }
        .calendar-date.active { background: var(--selected-blue); color: white; font-weight: bold; }
        .calendar-date.today { border: 1px solid var(--primary); }
        .calendar-date.other-month { color: #555; }

        /* --- CENTER AREA: DYNAMIC CONTENT --- */
        .content-area {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .section-title {
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .card-btn {
            background: var(--panel);
            border: 1px solid var(--border);
            color: white;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }

        .card-btn:hover { border-color: var(--primary); transform: translateY(-3px); }

        /* Hidden by default, JS will toggle display: block */
        #roomView, #scheduleView, #selectedRoomId, #form-group-error-msg, #form-group-error-msg-2 { display: none; }

        /* --- RIGHT SIDEBAR: FORM --- */
        .sidebar-right {
            width: 300px;
            background-color: var(--panel);
            padding: 1.5rem;
            border-left: 1px solid var(--border);
        }

        .form-group { margin-bottom: 1.2rem; }
        label { font-size: 0.8rem; color: #aaa; }
        input { 
            width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;
            background: #111; color: white; border: 1px solid var(--border); border-radius: 4px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid var(--border); text-align: left; }
    </style>
</head>
<body>

    <nav>
        <div style="font-size: 1.2rem; font-weight: bold; margin-right: 1100px;">COEP Scheduler</div>
        <div id="userDisplay" style="margin-right: 10px;"></div><button onclick="userLogOut()">LogOut</button>
    </nav>

    <div class="main-container">
        <aside class="sidebar-left">
            <div class="calendar-header">
                <span id="monthYear">April 2026</span>
                    <div>
                        <button onclick="changeMonth(-1)">&lt;</button>
                        <button onclick="changeMonth(1)">&gt;</button>
                    </div>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-label">S</div><div class="calendar-day-label">M</div>
                <div class="calendar-day-label">T</div><div class="calendar-day-label">W</div>
                <div class="calendar-day-label">T</div><div class="calendar-day-label">F</div>
                <div class="calendar-day-label">S</div>
                
                <div class="calendar-date other-month">29</div><div class="calendar-date other-month">30</div>
                <div class="calendar-date other-month">31</div><div class="calendar-date">1</div>
                <div class="calendar-date">2</div><div class="calendar-date">3</div>
                <div class="calendar-date">4</div><div class="calendar-date">5</div>
                <div class="calendar-date">6</div><div class="calendar-date">7</div>
                <div class="calendar-date">8</div><div class="calendar-date">9</div>
                <div class="calendar-date active today">10</div><div class="calendar-date">11</div>
                </div>
        </aside>

        <main class="content-area">
            
            <section id="deptView">
                <h2 class="section-title">Select Department</h2>
                <div class="btn-grid">
                    <div class="card-btn" onclick="showRooms('Civil')">Civil</div>
                    <div class="card-btn" onclick="showRooms('AC')">AC</div>
                    <div class="card-btn" onclick="showRooms('EE')">Electrical</div>
                    <div class="card-btn" onclick="showRooms('EnTC')">EnTC</div>
                    <div class="card-btn" onclick="showRooms('Mech')">Mechanical</div>
                    <div class="card-btn" onclick="showRooms('Meta')">Metallurgy</div>
                    <div class="card-btn" onclick="showRooms('Mgmt')">Management</div>
                    <div class="card-btn" onclick="showRooms('Manu')">Manufacturing</div>
                    <div class="card-btn" onclick="showRooms('CS')">Computer Sciences</div>

                </div>
            </section>

            <section id="roomView">
                <button onclick="showDepts()" style="margin-bottom: 20px;">&larr; Back to Depts</button>
                <h2 class="section-title">Rooms in <span id="selectedDeptName"></span></h2>
                <div class="btn-grid" id="roomBtnContainer">
                </div>
            </section>

            <section id="scheduleView">
                <button onclick="showRooms(document.getElementById('selectedDeptName').innerText)" style="margin-bottom: 20px;">&larr; Back to Rooms</button>
                <h2 class="section-title">Schedule for <span id="selectedRoomName">...</span><span id="selectedRoomId"></span></h2>
                <table>
                    <thead>
                        <tr><th>Time</th>
                            <th>By</th>
                            <th>Purpose</th>
                            <th>Subject</th>
                            <th>Professor</th>
                        </tr>
                    </thead>
                    <tbody id="bookingList"></tbody>
                </table>
            </section>
        </main>

        <aside class="sidebar-right">
            <h3>New Booking</h3>
            <div class="form-group" id="form-group-error-msg" style="color:red;">*Select a room first</div>
            <div class="form-grou" id="form-group-error-msg-2" style="color: red;">*Enter all fields.</div>
            <div class="form-group"><label>Room ID</label><input type="text" id="displayRoom" readonly></div>
            <div class="form-group"><label>Purpose</label><input type="text" id="purpose"></div>
            <div class="form-group"><label>Start</label><input type="time" id="startTime"></div>
            <div class="form-group"><label>End</label><input type="time" id="endTime"></div>
            <div class="form-group"><label>Subject</label><input type="text" id="subject"></div>
            <div class="form-group"><label>Professor ID</label><input type="number" id="professor"></div>
            <button style="width: 100%; background: var(--primary); border: none; padding: 12px; font-weight: bold; cursor: pointer;" onclick="createBooking()">
                Confirm
            </button>
        </aside>
    </div>
    <script src="bookings_main.js"></script>
</body>
</html>
