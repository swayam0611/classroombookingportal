<!DOCTYPE html>
<html>
<head>
    <title>COEP Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <h1 id="title">Classroom Booking Admin</h1>
    
    
    <div class="form-group">   
        <h3>Add New Room</h3>
        <input type="text" id="roomName" placeholder="Room Name (e.g. Lab 1)">
        <input type="number" id="roomCap" placeholder="Capacity">
        <input type="text" id="roomDept" placeholder="Department">
        <button onclick="addRoom()">Add Room</button>
    </div>

    <h3 style="margin-left: 30px;">Existing Rooms</h3>
    <table id="roomTable">
        
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Dept</th>
                <th>Capacity</th>
                <th id="actioncol">Action</th>
            </tr>
        </thead>
        <tbody id="roomList"></tbody>
    </table>

    <script src="admin.js"></script>
</body>
</html>
