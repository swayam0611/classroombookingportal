<!DOCTYPE html>
<html>
<head>
    <title>COEP Classroom Booking Panel</title>
    <style>
        /* 1. Global Reset & Base Styles */
/* --- MODERN LIGHT UI REPLICA --- */

:root {
    --bg-body: #f0f2f5;
    --bg-card: #ffffff;
    --primary-blue: #1a73e8;
    --primary-hover: #1557b0;
    --text-main: #202124;
    --text-muted: #5f6368;
    --border-color: #dadce0;
    --shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-body);
    color: var(--text-main);
    padding: 40px;
    line-height: 1.6;
}

/* Header/Navbar Styling */
nav {
    background-color: var(--bg-card);
    padding: 15px 40px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    margin: -40px -40px 30px -40px; /* Flush with top */
}

.logo {
    font-weight: 600;
    color: var(--primary-blue);
    font-size: 1.2rem;
}

#title {
    background-color: var(--bg-card);
    color: var(--text-main);
    padding: 25px;
    text-align: center;
    border-radius: 8px;
    margin-bottom: 30px;
    box-shadow: var(--shadow);
    font-size: 28px;
    font-weight: 500;
}

/* Form Container (The Card) */
.form-group {
    background-color: var(--bg-card);
    padding: 30px;
    border-radius: 8px;
    width: 100%;
    max-width: 95%; /* Wider for the many booking inputs */
    margin: 0 auto 40px auto;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
}

h3 {
    margin-top: 0;
    font-size: 20px;
    font-weight: 500;
    color: var(--text-main);
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 10px;
}

/* Inputs, Selects, and Dates */
input {
    width: 100%;
    padding: 12px 15px;
    font-size: 15px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    margin-bottom: 15px;
    background-color: #fff;
    color: var(--text-main);
    transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
    outline: none;
    border-color: var(--primary-blue);
    box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
}


/* Table Styling */
#roomTable {
    width: 95%;
    margin: 20px auto;
    background-color: var(--bg-card);
    border-collapse: collapse;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
}

#roomTable thead {
    background-color: #f8f9fa;
}

#roomTable th {
    padding: 16px;
    text-align: left;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    border-bottom: 2px solid var(--border-color);
}

#roomTable td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-main);
    font-size: 14px;
}

#roomTable tbody tr:hover {
    background-color: #f1f3f4;
}
    </style>
</head>
<body>
    <nav>
        <div class="logo">COEP Room Booking</div>
    </nav>
    <h1 id="title">Classroom Booking Register</h1>

    <div class="form-group">   
        <h3>Create new booking</h3>
        <input type="number" id="roomID" placeholder="Room ID">
        <input type="date" id="bookingDate">
        <input type="text" id="bookingPurpose" placeholder="Purpose">
        <input type="time" id="startTime" placeholder="Start Time">
        <input type="time" id="endTime" placeholder="End Time">
        <input type="text" id="subject" placeholder="Subject">
        <input type="number" id="professorID" placeholder="Professor ID">       
        <button onclick="createBooking()">Create Booking</button>
    </div>
    
    

    <h3 style="margin-left: 30px;">Existing Rooms</h3>
    <table id="roomTable">
        
        <thead>
            <tr>
                <th>Purpose</th>
                <th>Date</th>
                <th>Start</th>
                <th>End</th>
                <th>Subject</th>
                <th>Booker</th>
                <th>Professor</th>
                <th>Room</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="bookingList"></tbody>
    </table>

    

    

    <script src="bookings.js"></script>
</body>
</html>
