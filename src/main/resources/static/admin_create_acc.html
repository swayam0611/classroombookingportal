<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Accounts</title>
    <link rel="stylesheet" href="admin_create_acc.css">
</head>
<body>
    <div class="form-group">   
        <h3>Create New Account</h3>
        <input type="number" id="contactNumber" placeholder="Contact Number"><br>
        <input type="text" id="division" placeholder="Division"><br>
        <input type="email" id="email" placeholder="e-mail"><br>
        <input type="text" id="name" placeholder="Name"><br>
        <input type="text" id="organization" placeholder="organization"><br>
        <input type="text" id="role" placeholder="Role"><br>
        <input type="text" name="" id="password" placeholder="password"><br>
        <button id="submit" onclick="createAccount()">Create Account</button>
    </div>
    <table>
    <thead><tr><th>Id</th>
            <th>Contact Number</th>
            <th>Division</th>
            <th>Email</th>
            <th>Name</th>
            <th>Organization</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="userList"></tbody>
        
    </table>
    <script src="admin_create_acc.js">
    </script>
</body>
</html>
